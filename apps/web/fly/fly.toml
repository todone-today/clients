# app.todone.today: the app's static files and, at the same address, the API (Caddy passes /api to todone-api over
# Fly's private network). Deploy from apps/web (CI does it on main):
#   fly deploy --config fly/fly.toml --dockerfile fly/Dockerfile
app = "todone-app"
primary_region = "sin" # the same region as todone-api and the database

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/manifest.webmanifest"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
