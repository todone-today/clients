name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    # main -> production at todone.today. The database is migrated by the server repo's deploy.
    if: github.event_name == 'push'
    needs: [web]
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_NNPaLOvnhZx4WAk5fFqcBoW8
      VERCEL_PROJECT_ID: prj_Fv7EqxAYuL8lui3gVItJ4XOnxORr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy with the Vercel CLI
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set; skipping deploy"
            exit 0
          fi
          npm i -g vercel@57
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
